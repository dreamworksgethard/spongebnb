<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spongebnb logo</title>
  <style>
    html, body { margin: 0; width: 1000px; height: 1000px; overflow: hidden; background: #0b4f90; }
    .badge {
      width: 1000px;
      height: 1000px;
      position: relative;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.45), transparent 32%),
        linear-gradient(180deg, #8fd8ff 0%, #1a90d8 42%, #0c5ea3 100%);
    }
    .ring {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 14px solid #14324a;
      box-shadow: inset 0 0 0 8px rgba(255,255,255,.35);
      pointer-events: none;
    }
    .disc {
      position: absolute;
      inset: 32px;
      border-radius: 50%;
      overflow: hidden;
    }
    .sand {
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -36px;
      height: 250px;
      background: linear-gradient(#f8e1a4, #e4b45e 70%, #d7a24a);
      border-radius: 50%;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #fff, rgba(255,255,255,.15) 55%, rgba(255,255,255,.05));
      border: 3px solid rgba(255,255,255,.75);
    }
    .b1 { width: 46px; height: 46px; left: 150px; top: 180px; }
    .b2 { width: 28px; height: 28px; left: 210px; top: 250px; }
    .b3 { width: 36px; height: 36px; right: 168px; top: 210px; }
    .b4 { width: 20px; height: 20px; right: 230px; top: 280px; }
    .mascot {
      position: absolute;
      left: 50%;
      top: 112px;
      width: 500px;
      transform: translateX(-50%);
      filter: drop-shadow(0 16px 0 rgba(7, 40, 68, .18));
    }
    .mascot svg { width: 100%; height: auto; display: block; }
  </style>
</head>
